# Litmus Configuration
# See https://github.com/nyambati/litmus for documentation

workspace:
  root: "config"      # Root package directory (contains alertmanager/base YAML, tests, regressions)
  fragments: "fragments" # Discovery pattern for team fragments (relative to root)
  history: 5          # Number of regression baselines to keep

# Global Test Labels: automatically added to every synthesized alert during 'snapshot'.
global_labels:

# Policy Configuration (optional, enforced during 'litmus check')
# policy:
#   skip_root:         # Exempt root package from specific policy checks
#     - enforce
#     - tests
#   require:
#     tests: true      # Every fragment must have at least one test
#     regression: true # A regression baseline must exist and cover all routes
#   enforce:
#     strict: false    # true = AND (all labels required), false = OR (any one label)
#     matchers:        # Label names that must appear in every route path
#       - severity
#       - label_team

# Sanity Checks (optional, defaults to fail mode for all categories)
# sanity:
#   orphan_receivers: warn       # "warn" or "fail"
#   dead_routes: warn            # "warn" or "fail"
#   shadowed_routes: warn        # "warn" or "fail"
#   inhibition_cycles: warn      # "warn" or "fail"
#   policy_violations: warn      # "warn" or "fail"
#   negative_only_routes: warn   # "warn" or "fail"
#   require_tests: warn          # "warn" or "fail" (policy: require.tests)
#   require_regression: warn     # "warn" or "fail" (policy: require.regression)

# Mimir Configuration (optional, used for 'litmus sync')
# mimir:
#   address: ""
#   tenant_id: ""
#   api_key: ""
